name: Release

# Push a tag that matches template/bridge/VERSION, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The template package goes to the GitHub release and to nuget.org, through nuget.org trusted
# publishing (no stored API key). There are no app binaries to ship: apps are built by their authors.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release; only the step that creates it gets the token
  id-token: write # a short-lived GitHub token, exchanged for a one-hour nuget.org key

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git dotnet-sdk qt6-base qt6-declarative gcc make clang lld python diffutils desktop-file-utils noto-fonts github-cli
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tag matches template/bridge/VERSION
        run: |
          test "v$(cat template/bridge/VERSION)" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$(cat template/bridge/VERSION)"; exit 1; }
      - name: Test
        run: sh scripts/test.sh
      # Two packages, one version: Omasharp.Analyzers (which every generated app references) and the template.
      - name: Pack
        run: |
          dotnet pack analyzers/Omasharp.Analyzers -o artifacts
          dotnet pack pack -o artifacts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A tag with a suffix (v0.1.0-rc.1) is a pre-release.
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes $pre
      # Matches the trusted publishing policy on nuget.org (owner luisrudge, this repo, release.yml).
      - name: nuget.org login
        uses: NuGet/login@v1
        id: login
        with:
          user: luisrudge
      - name: nuget.org
        # The analyzers first: apps made from the new template restore them.
        run: |
          for p in artifacts/Omasharp.Analyzers.*.nupkg artifacts/Omasharp.Templates.*.nupkg; do
            dotnet nuget push "$p" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
