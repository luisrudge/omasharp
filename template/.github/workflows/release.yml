name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git dotnet-sdk qt6-base qt6-declarative gcc make clang lld desktop-file-utils github-cli
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tag matches the version
        run: |
          v=$(dotnet msbuild -getProperty:Version)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v (<Version> in the .csproj)"; exit 1; }
      - name: Test
        run: if ls tests/*.csproj >/dev/null 2>&1; then dotnet run --project tests; fi
      - name: Package
        run: dotnet publish -t:Package
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes $pre
